name: Verify and release to Maven Central

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      core_commit:
        description: Optional full plugin-core SHA for source-candidate HTTP file verification
        type: string
      importer_commit:
        description: Optional full importer SHA (required together with core_commit)
        type: string

permissions:
  contents: read

jobs:
  http-file-consumers:
    if: github.event_name == 'workflow_dispatch' && (inputs.core_commit != '' || inputs.importer_commit != '')
    uses: ./.github/workflows/http-file-consumers.yml
    with:
      core_commit: ${{ inputs.core_commit }}
      importer_commit: ${{ inputs.importer_commit }}

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: central-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify immutable release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" != *SNAPSHOT* ]]
      - name: Verify release dependencies and tests
        run: ./mvnw -B -ntp clean verify
      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp deploy -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
